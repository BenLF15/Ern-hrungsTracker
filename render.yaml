# Render Blueprint: Dashboard -> New -> Blueprint -> dieses Repository wählen.
# Die App ist rein statisch und wird als "Static Site" ausgeliefert (kostenlos, mit HTTPS und CDN).
services:
  - type: web
    runtime: static
    name: naehrwert
    buildCommand: npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      # Service Worker, HTML und Manifest immer frisch laden, damit Updates sofort ankommen
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache

  # Thabstracker-KOPIE + Ernährungstracker unter einer Adresse (Verknüpfung Variante A).
  # Getrennt vom echten Thabstracker: eigener Dienst, eigene Daten, eigene Zugänge.
  #   /              Thabstracker-Kopie   (Coach-Login: Benutzername "coach", Passwort = COACH_PASSWORD)
  #   /ernaehrung/   Ernährungstracker    (überträgt die Kalorien automatisch in den Check-in)
  - type: web
    runtime: node
    name: thabs-kopie
    plan: free
    buildCommand: npm run build
    startCommand: npm run start:thabs
    healthCheckPath: /healthz
    pullRequestPreviewsEnabled: false
    envVars:
      - key: COACH_PASSWORD
        generateValue: true   # im Render-Dashboard unter "Environment" einsehbar
    # Ohne Persistent Disk gehen die Daten bei jedem Neustart/Deploy verloren (Free-Plan).
    # Für dauerhafte Daten: Plan "starter" wählen, diese Disk aktivieren und DATA_DIR setzen:
    # disk:
    #   name: thabs-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (envVars ergänzen:  - key: DATA_DIR   value: /var/data)
