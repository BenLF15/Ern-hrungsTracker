<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NährWert – Ernährungstracker</title>
  <meta name="description" content="Kalorien, Makronährstoffe und Wasser tracken – mit offiziellen Nährwertdaten (BLS 4.0), Barcode-Scan und KI-Fotoerkennung.">
  <meta name="theme-color" content="#1f7a55">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="prevDay" aria-label="Vorheriger Tag">‹</button>
      <button class="date-btn" id="dateLabel" aria-label="Datum wählen"></button>
      <input type="date" id="datePicker" class="visually-hidden" tabindex="-1" aria-hidden="true">
      <button class="icon-btn" id="nextDay" aria-label="Nächster Tag">›</button>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Hauptnavigation">
      <button data-tab="today" class="active"><span class="ti">◎</span><span>Heute</span></button>
      <button data-tab="stats"><span class="ti">▥</span><span>Verlauf</span></button>
      <button data-tab="add" class="add-tab" aria-label="Lebensmittel hinzufügen"><span class="ti plus">+</span></button>
      <button data-tab="foods"><span class="ti">☰</span><span>Lebensmittel</span></button>
      <button data-tab="settings"><span class="ti">⚙</span><span>Einstellungen</span></button>
    </nav>
  </div>

  <!-- Generisches Bottom-Sheet / Modal -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <button class="icon-btn" id="sheetBack" aria-label="Zurück" hidden>‹</button>
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn" data-close aria-label="Schließen">✕</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>Diese App benötigt JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
